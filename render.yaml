# Render Blueprint — free tier (no persistent disk)
# Note: Render may still ask for a card for identity verification on some accounts,
# but the free web service itself costs $0. Use Koyeb or Cloudflare Tunnel if you
# want to avoid entering card details entirely.
services:
  - type: web
    name: cropeazy
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt && python -m backend.model_download
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: JWT_SECRET
        generateValue: true
      - key: DEV_MODE
        value: "true"
      - key: SKIP_MODEL_PRELOAD
        value: "true"
      - key: DATABASE_PATH
        value: /tmp/cropeazy.db
