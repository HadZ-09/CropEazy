# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: cropeazy
    runtime: python
    plan: starter
    region: singapore
    buildCommand: pip install -r requirements.txt && python -m backend.model_download
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: JWT_SECRET
        generateValue: true
      - key: DEV_MODE
        value: "true"
      - key: DATABASE_PATH
        value: /var/data/cropeazy.db
    disk:
      name: cropeazy-data
      mountPath: /var/data
      sizeGB: 1
